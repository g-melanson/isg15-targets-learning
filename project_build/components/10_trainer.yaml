component:
  id: trainer
  module: src/training/trainer.py
  responsibility: >
    Run the training loop: forward pass, focal loss, AdamW optimisation with
    gradient accumulation, validation AUPRC checkpointing, and per-epoch logging.

  note_on_execution: >
    This component is USER-RUN. The agent writes the code; the user executes it.
    Do not attempt to run training.

  interface:
    signature: train(model, train_loader, val_loader, cfg) -> None
    inputs:
      - name: model
        type: FullSequenceBiLSTMClassifier
      - name: train_loader
        type: DataLoader  # from bucket_sampler
      - name: val_loader
        type: DataLoader  # from bucket_sampler
      - name: cfg
        type: TrainConfig  # dataclass defined in this module
    outputs:
      - name: checkpoints/best_model.pt
        description: State dict of the epoch with highest validation AUPRC
      - name: logs/train_log.csv
        description: Per-epoch train loss, val loss, train AUPRC, val AUPRC

  config:
    class: TrainConfig  # dataclass
    fields:
      loss: FocalLoss
      focal_alpha: 1.0
      focal_gamma: 2.0
      optimizer: AdamW
      lr: 1.0e-4
      weight_decay: 1.0e-3
      epochs: 50
      effective_batch_size: 128
      checkpoint_dir: checkpoints/
      log_dir: logs/

  training_details:
    gradient_accumulation: >
      If physical batch size < 128, accumulate gradients over
      ceil(128 / physical_batch_size) steps before calling optimizer.step().
    checkpointing: >
      Save model state dict whenever val AUPRC exceeds the best seen so far.
      Checkpoint filename: checkpoints/best_model.pt (overwrite in place).
    logging: >
      Append one row per epoch to logs/train_log.csv with columns:
      epoch, train_loss, val_loss, train_auprc, val_auprc.

  focal_loss:
    description: >
      Binary focal loss: FL(p) = -alpha * (1 - p)^gamma * log(p).
      Downweights easy negatives; forces model to focus on hard examples.
      Defined in this module or imported from torchvision.ops.sigmoid_focal_loss.
    alpha: 1.0
    gamma: 2.0

  runtime_dependencies:
    - bucket_sampler      # train_loader, val_loader
    - bilstm_classifier   # model
