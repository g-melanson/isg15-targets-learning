dependencies:
  - biopython==1.88
  - h5py==3.16.0
  - numpy==2.5.3
  - pandas==3.0.6
  - scikit-learn==1.9.1
  - sentencepiece==0.2.2
  - tables==3.11.1
  - tqdm==4.70.1
  - transformers==5.17.0

# One network volume holds everything: pipeline artefacts, the uploaded src/
# package, the ProtT5 weight cache (~12 GB), checkpoints and logs.
# (The SDK permits at most one network volume per task.)
#
# `datacenter` is used only when the named volume does not exist yet. If
# isg15-data already lives elsewhere, delete it first (data is still local):
#   rp volume list
#   rp volume delete -y <id>
#   rp volume create --name isg15-data --size 50 --data-center US-IL-1 --type standard
volume:
  name: isg15-data
  size_gb: 50
  mount: /data
  datacenter: US-IL-1
